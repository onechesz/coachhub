services:
  postgres:
    image: postgres:16
    container_name: coachhub-postgres
    restart: always
    environment:
      POSTGRES_DB: coachhub
      POSTGRES_USER: coachhub
      POSTGRES_PASSWORD: coachhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: