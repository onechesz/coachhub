databaseChangeLog:
  - changeSet:
      id: 001-create-user
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - not:
            - tableExists:
                tableName: user

      changes:
        - createTable:
            tableName: user

            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(20)

                  constraints:
                    nullable: false

              - column:
                  name: pass
                  type: varchar(255)

                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: varchar(50)

                  constraints:
                    unique: true

              - column:
                  name: card_number
                  type: varchar(4)

              - column:
                  name: email
                  type: varchar(255)

                  constraints:
                    unique: true

      rollback:
        - dropTable:
            tableName: user

  - changeSet:
      id: 002-create-student
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - not:
            - tableExists:
                tableName: student

      changes:
        - createTable:
            tableName: student

            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: varchar(255)

                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: varchar(255)

                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: text

              - column:
                  name: telegram
                  type: varchar(32)

              - column:
                  name: whatsapp
                  type: varchar(32)

              - column:
                  name: phone
                  type: varchar(32)

              - column:
                  name: user_id
                  type: bigint

                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: student

  - changeSet:
      id: 003-create-fk-student-user
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - and:
            - tableExists:
                tableName: student

            - tableExists:
                tableName: user

            - not:
                foreignKeyConstraintExists:
                  foreignKeyName: student_user_fk

      changes:
        - addForeignKeyConstraint:
            baseTableName: student
            baseColumnNames: user_id
            constraintName: student_user_fk
            referencedTableName: user
            referencedColumnNames: id

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: student
            constraintName: student_user_fk

  - changeSet:
      id: 004-create-lesson
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - not:
            - tableExists:
                tableName: lesson

      changes:
        - createTable:
            tableName: lesson

            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: description
                  type: varchar(255)

              - column:
                  name: date_start
                  type: timestamp

              - column:
                  name: date_end
                  type: timestamp

              - column:
                  name: lesson_type
                  type: varchar(50)

                  constraints:
                    nullable: false

              - column:
                  name: regular
                  type: boolean

                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: bigint

              - column:
                  name: next_id
                  type: bigint

              - column:
                  name: created_at
                  type: timestamp

                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: lesson

  - changeSet:
      id: 005-create-lesson-type-check
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - tableExists:
            tableName: lesson

      changes:
        - sql:
            sql: |
              ALTER TABLE lesson
              ADD CONSTRAINT lesson_type_chk
              CHECK (lesson_type IN ('INDIVIDUAL', 'GROUP', 'TRAINING', 'CONSULTATION'));

      rollback:
        - sql:
            sql: |
              ALTER TABLE lesson
              DROP CONSTRAINT lesson_type_chk;

  - changeSet:
      id: 006-create-fk-lesson-user
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - and:
            - tableExists:
                tableName: lesson

            - tableExists:
                tableName: user

            - not:
                foreignKeyConstraintExists:
                  foreignKeyName: lesson_user_fk

      changes:
        - addForeignKeyConstraint:
            baseTableName: lesson
            baseColumnNames: user_id
            constraintName: lesson_user_fk
            referencedTableName: user
            referencedColumnNames: id

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: lesson
            constraintName: lesson_user_fk

  - changeSet:
      id: 007-create-fk-lesson-lesson
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - and:
            - tableExists:
                tableName: lesson

            - not:
