            baseColumnNames: next_id
            constraintName: lesson_lesson_fk
            referencedTableName: lesson
            referencedColumnNames: id

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: lesson
            constraintName: lesson_lesson_fk

  - changeSet:
