databaseChangeLog:
  - changeSet:
      id: 001-insert-mock-user
      author: ivan minyaev

      preConditions:
        - onFail: MARK_RAN

        - tableExists:
            tableName: user

      changes:
        - insert:
            tableName: user

            columns:
              - column:
                  name: name
                  value: Teacher

              - column:
                  name: pass
                  value: pass

              - column:
                  name: email
                  value: teacher@mail.com

      rollback:
        - delete:
            tableName: user
            where: email = 'teacher@mail.com'